[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"

[project]
name = "add_subs_to_videos"
dynamic = ["version"]
description = "Add missing subtitles. Recursive video-to-SRT transcription using whisper.cpp"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pywhispercpp",
    "tqdm",
]

[project.optional-dependencies]
gui = ["pyside6"]

[project.scripts]
add_subs_to_videos = "add_subs_to_videos.cli:main"
add-subs-to-videos-gui = "add_subs_to_videos.gui:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-mock", "pytest-qt", "pytest-forked"]

[tool.pytest.ini_options]
pythonpath = ["src"]
qt_api = "pyside6"
addopts = "-vvv -rA"
markers = [
    "integration: end-to-end tests that run the full pipeline against bundled audio",
]

[tool.uv]
package = true

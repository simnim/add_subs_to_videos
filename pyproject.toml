[project]
name = "add_subs_to_videos"
version = "0.1.0"
description = "Add missing subtitles. Recursive video-to-SRT transcription using WhisperX and speaker diarization"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "whisperx",
    "torch>=2.0",
    "pyannote.audio>=3.1",
    "faster-whisper",
    "ctranslate2",
    "tqdm",
]

[project.scripts]
crawl-srt = "add_subs_to_videos.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-mock"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-vvv -rA"
markers = [
    "integration: end-to-end tests that download real audio and run the full WhisperX pipeline (requires HUGGINGFACE_TOKEN)",
]

[tool.uv]
package = true

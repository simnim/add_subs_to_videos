[project]
name = "add_subs_to_videos"
version = "0.1.1"
description = "Add missing subtitles. Recursive video-to-SRT transcription using whisper.cpp"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pywhispercpp",
    "tqdm",
]

[project.optional-dependencies]
gui = ["pyside6"]

[project.scripts]
add_subs_to_videos = "add_subs_to_videos.cli:main"
add-subs-to-videos-gui = "add_subs_to_videos.gui:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-mock", "pytest-qt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
qt_api = "pyside6"
addopts = "-vvv -rA"
markers = [
    "integration: end-to-end tests that download real audio and run the full pipeline (requires HUGGINGFACE_TOKEN)",
]

[tool.uv]
package = true

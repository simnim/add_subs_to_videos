name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update && sudo apt install -y ffmpeg gdb \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libfontconfig1 libfreetype6

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg cmake

      - name: Install dependencies
        run: uv sync --group dev --extra gui

      - name: Run unit tests
        run: uv run pytest tests/ -m "not integration"

      - name: Run integration tests
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo sysctl -w kernel.core_pattern=core.%p
            ulimit -c unlimited
            uv run pytest tests/ -m integration --forked
          else
            uv run pytest tests/ -m integration
          fi

      - name: Dump native backtrace on crash
        if: failure() && runner.os == 'Linux'
        run: |
          shopt -s nullglob
          cores=(core.*)
          if [ ${#cores[@]} -eq 0 ]; then
            echo "No core dump found."
          else
            for core in "${cores[@]}"; do
              echo "=== Backtrace from $core ==="
              gdb -batch -ex "thread apply all bt full" -ex quit .venv/bin/python "$core"
            done
          fi
